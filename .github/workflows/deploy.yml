name: Deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 's1ash-cmd/GUtv_backend_dotnet' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, gutv-backend]
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Build and deploy on server
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/local/bin:/usr/bin:/bin
          exec 9>/opt/gutv/src/.deploy.lock
          flock -w 1800 9
          cd /opt/gutv/src/GUtv_backend_dotnet
          test "$(git branch --show-current)" = master
          sudo -n -l /usr/bin/systemctl restart gutv-backend.service >/dev/null
          git pull --ff-only origin master
          dotnet publish GUtv_backend_dotnet.csproj -c Release -o /opt/gutv/backend
          sudo -n systemctl restart gutv-backend.service
          sleep 3
          systemctl is-active --quiet gutv-backend.service
