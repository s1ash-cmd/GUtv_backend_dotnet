name: Deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Publish on Fedora server
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in repository secrets}"
          : "${DEPLOY_USER:?Set DEPLOY_USER in repository secrets}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in repository secrets}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in repository secrets}"
          install -m 700 -d "$RUNNER_TEMP/gutv-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/gutv-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/gutv-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/gutv-ssh/key"
          ssh -i "$RUNNER_TEMP/gutv-ssh/key" \
            -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/gutv-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'flock -w 1800 /opt/gutv/src/.deploy.lock bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/gutv/src/GUtv_backend_dotnet
          git pull --ff-only origin master
          dotnet publish GUtv_backend_dotnet.csproj -c Release -o /opt/gutv/backend
          sudo -n systemctl restart gutv-backend.service
          sleep 3
          systemctl is-active --quiet gutv-backend.service
          REMOTE
